name: CI

on:
  push:
    branches: ["main"]
    tags: ['*']
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # secrets
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  # vars
  VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
  VITE_API_URL: ${{ vars.VITE_API_URL }}

jobs:
  dast-testing:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --silent --frozen-lockfile --prefer-offline
      - run: cp .env.sample .env && pnpm env:up && pnpm -F api db:migrate && pnpm -F api db:seed
      - name: Start application
        run: |
          pnpm -F api start:dev & pnpm -F webapp build:dev &
          timeout 30 sh -c 'until curl -fsS http://localhost:8080/healthcheck >/dev/null && curl -fsS http://localhost:3000 >/dev/null; do sleep 1; done'
      - name: Bootstrap authenticated ZAP identities
        run: node security/zap-bootstrap.mjs > /tmp/zap-identities.json
      - name: ZAP active and baseline scan
        run: |
          mkdir -p zap-reports
          docker run --network host --user zap --rm -v "$PWD:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t http://127.0.0.1:8080 -m 5 -J /zap/wrk/zap-reports/api-active.json || test $? -le 2
          docker run --network host --user zap --rm -v "$PWD:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:3000 -m 5 -J /zap/wrk/zap-reports/web-baseline.json || test $? -le 2
          jq -n '{version:"2.1.0", "$schema":"https://json.schemastore.org/sarif-2.1.0.json", runs:[]}' > zap-reports/combined.sarif
      - name: Upload ZAP SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zap-reports/combined.sarif
  test:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --silent --frozen-lockfile --prefer-offline

      - name: Cache playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install playwright
        run: pnpm -F e2e exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc

      - name: Setup envs
        run: cp .env.sample .env

      - name: Start testing environment
        run: |
          export $(grep -v '^#' .env | xargs)
          pnpm env:up
          timeout 10 bash -c -- "while ! docker run --rm --network=host -i postgres:18-alpine pg_isready --quiet --timeout=1 -d ${DB_URI:?}; do sleep 1; done"
          pnpm -F api db:migrate
          pnpm -F api db:seed

      - name: Test package "api"
        run: pnpm -F api test

      - name: Test package "webapp"
        run: pnpm -F webapp test

      - name: E2E testing
        run: |
          # start api service
          pnpm -F api start:dev &
          timeout 10 sh -c 'until $(curl --output /dev/null --silent --head --fail http://localhost:8080/healthcheck); do printf .; sleep 1; done'

          # start webapp service
          pnpm -F webapp build:dev &
          timeout 10 sh -c 'until $(curl --output /dev/null --silent --head --fail http://localhost:3000); do printf .; sleep 1; done'
        
          pnpm -F e2e test

  build-and-deploy:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'test' }}
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image "api"
        run: DOCKER_BUILDKIT=1 docker build --quiet --rm --force-rm -t api -f ./packages/api/Dockerfile .

      - name: Build image "webapp"
        run: DOCKER_BUILDKIT=1 docker build --quiet --rm --force-rm --build-arg VITE_API_URL -t webapp -f ./packages/webapp/Dockerfile .

      - name: Dockerhub login
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Push image "api"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag api $DOCKERHUB_USERNAME/voto-api
          docker push $DOCKERHUB_USERNAME/voto-api

      - name: Push image "webapp"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag webapp $DOCKERHUB_USERNAME/voto-webapp
          docker push $DOCKERHUB_USERNAME/voto-webapp
