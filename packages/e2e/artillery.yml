config:
  target: http://localhost:8080
  phases:
    - name: "For 30 seconds, 100 users every second, up to 1000 concurrent users"
      duration: 30
      arrivalRate: 100
      maxVusers: 1000

  log:
    level: error

  http:
    timeout: 1

  plugins:
    expect:
      reportFailuresAsErrors: true
      outputFormat: silent

    ensure:
      maxErrorRate: 1 # max 1% of vusers scenario failures / vusers created
      thresholds:
        - http.response_time.p99: 250 # p99 response time <= 500ms
        - http.response_time.p95: 100 # p95 response time <= 250ms

